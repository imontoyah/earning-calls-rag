# fly.toml app configuration file generated for earning-calls-rag on 2026-05-08T18:21:11-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'earning-calls-rag'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[env]
  STATE_DIR = "/state"

[mounts]
  source = "earnings_state"
  destination = "/state"